osl-controller:
  category: com.itav.osl.gcontroller
  version: 0.0.1

slice-manager:
  #  url: "${SLICE_MANAGER_URL:http://127.0.0.1:8000}"
  url: "${SLICE_MANAGER_URL:http://10.16.255.54:8000}"
  username: "${SLICE_MANAGER_USERNAME:admin}"
  password: "${SLICE_MANAGER_PASSWORD:password}"

server:
  port: 0

spring:
  config:
    activate:
      on-profile: "default"
  application:
    name: ExampleGenericController
    description: "This is a description for controller gcontroller.examples.osl.etsi.org app"




  servlet:
    multipart.max-file-size: 10MB
    multipart.max-request-size: 10MB
  activemq:
    brokerUrl: tcp://10.255.28.207:61616?jms.watchTopicAdvisories=false
    user: artemis
    password: artemis
    pool:
      enabled: true
      max-connections: 100
    packages:
      trust-all: true
  autoconfigure.exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

logging:
  level:
    root: INFO
    org.etsi.osl.gsma.ewbi.*: DEBUG
    org.springframework: INFO
    org.apache.camel: INFO
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
    file: "%d %p %c{1.} [%t] %m%n"




oauthsign:
  key: "EK97Y7Y9WPGG1MEG"

