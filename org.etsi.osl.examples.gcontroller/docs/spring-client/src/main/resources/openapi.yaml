    CellUpdateRequest:
      additionalProperties: false
      anyOf: []
      description: |
        Cell update payload.

        Include `operation`, `properties`, or both.
      example:
        operation: activate
        properties:
          mimo: true
          max_transmit_power: 242
      nullable: true
      properties:
        operation:
          description: Allowed state operation for a cell.
          enum:
          - activate
          - deactivate
          example: activate
          type: string
        properties:
          $ref: "#/components/schemas/CellProperties"
      type: object
    CellBulkUpdateRequest:
      additionalProperties: false
      anyOf: []
      description: Bulk update payload for multiple cells in a BBU.
      example:
        cell_ids:
        - 151
        - 152
        operation: activate
        properties:
          mimo: true
          max_transmit_power: 242
      nullable: true
      properties:
        cell_ids:
          example:
          - 151
          - 152
          items:
            type: integer
          minItems: 1
          type: array
        operation:
          description: Allowed state operation for each selected cell.
          enum:
          - activate
          - deactivate
          example: activate
          type: string
        properties:
          $ref: "#/components/schemas/CellProperties"
      required:
      - cell_ids
      type: object
