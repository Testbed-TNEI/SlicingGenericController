        state: REGISTERED
        nssai: 1-333333
        nr_cell_id: 52
      properties:
        guti:
          description: Globally Unique Temporary Identifier assigned to the UE.
          type: string
        five_g_m_tmsi:
          description: "5G-mTMSI, decoded from the trailing bytes of the GUTI."
          format: int64
          type: integer
        property:
          type: string
        mm_status:
          description: Mobility-management status.
          type: string
        state:
          description: Registration / connection state.
          type: string
        nssai:
          description: Allowed NSSAI for the UE.
          type: string
        nr_cell_id:
          description: "Serving NR Cell ID, decoded from the trailing bytes."
          type: integer
      type: object
    UeControlInfoResponse:
