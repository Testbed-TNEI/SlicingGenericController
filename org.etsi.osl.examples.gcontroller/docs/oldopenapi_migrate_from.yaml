            schema:
              $ref: "#/components/schemas/UE"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                description: Created
                data:
                  id: 20
                  IMSI: 999080100001125
                  slice: test
                  operational_state: ENABLED
                  AMDATA: true
                  SNSSAI: 1-222222
                  DNN: test
                  DEFAULT: "TRUE"
                  UEcanSendSNSSAI: "FALSE"
                  IMSIGroupNAME: test999080100001125
                  numIMSIs: 1
              schema:
                $ref: "#/components/schemas/RW_UEResponse_"
          description: Successful Response
        "401":
          content:
            application/json:
              example:
                detail: Invalid authentication credentials
          description: Unauthorized
        "475":
          content:
            application/json:
              example:
                description: "c1, c2 commands failed when creating UEs"
                data:
                  id: 20
                  IMSI: 999080100001125
                  slice: test
                  operational_state: ENABLED
                  AMDATA: true
                  SNSSAI: 1-222222
                  DNN: test
                  DEFAULT: "TRUE"
                  UEcanSendSNSSAI: "FALSE"
                  IMSIGroupNAME: test999080100001125
                  numIMSIs: 1
          description: Additional Response
        "405":
          content:
            application/json:
              example:
                description: Not Allowed
                errors: UE association already exists.
          description: Method Not Allowed
        "400":
          content:
            application/json:
              example:
                description: Bad request
                errors: Exception String
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create a new UE and associate it with a slice
      tags:
      - UE
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: UE
      - tag: UE
