  /productOrder/post:
    post:
      description: Create a new Network Slice Product Order
      operationId: create_product_order_productOrder_post_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkSliceCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                description: Created
                data:
                  description: Success
                  data:
                    id: 5GASPHigh
                    name: 5gasp
                    DNN: 5gasp.eu
                    administrative_state: AdministrativeState.UNLOCKED
                    operational_state: OperationalState.ENABLED
                    sst: "1"
                    sd: "222222"
                    dllatency: "20"
                    ullatency: "20"
                    dlguathptperue: "20000.0"
                    ulguathptperue: "20000.0"
                    dlmaxthptperue: "50000.0"
                    ulmaxthptperue: "50000.0"
                    delaytolerance: DelayTolerance.NOT_SUPPORTED
                    reliability: "99.9"
                    dldeterministiccomm: DeterministicCommAvailability.NOT_SUPPORTED
                    uldeterministiccomm: DeterministicCommAvailability.NOT_SUPPORTED
                    coverage_area:
                      IT: Coverage Area Description
                    n6protections:
                    - type: PCC Rule
                      name: rule_any
                    kpis: []
              schema:
                $ref: "#/components/schemas/RW_ProductOrder_"
          description: Successful Response
        "401":
          content:
            application/json:
              example:
                detail: Invalid authentication credentials
              schema:
                $ref: "#/components/schemas/RWDetail"
          description: Unauthorized
        "476":
          content:
            application/json:
              example:
                description: The maximum number of slices created was reached.
                data: Slice number reached the limit.
              schema:
                $ref: "#/components/schemas/RWStr"
          description: Additional Response
        "475":
          content:
            application/json:
              example:
                description: "c1, c2"
                data:
                  coverage_area:
                  - IT
                  operational_state: OperationalState.ENABLED
                  administrative_state: AdministrativeState.UNLOCKED
                  sst: "1"
                  sd: "222222"
                  prioritylabel: "100"
                  dllatency: "20"
                  ullatency: "20"
                  dlguathptperue: "20000.0"
                  ulguathptperue: "20000.0"
                  dlmaxthptperue: "50000.0"
                  ulmaxthptperue: "50000.0"
                  delaytolerance: DelayTolerance.NOT_SUPPORTED
                  reliability: "99.9"
                  dldeterministiccomm: DeterministicCommAvailability.NOT_SUPPORTED
                  uldeterministiccomm: DeterministicCommAvailability.NOT_SUPPORTED
                  n6protection:
                  - type: PCC Rule
                    name: rule_any
                  dnn: test.eu
                  name: fail_475_0
                  id: test_slice_0
              schema:
                $ref: "#/components/schemas/RW_NetworkSliceCreate_"
          description: Additional Response
        "405":
          content:
            application/json:
              example:
                description: Operation not allowed
                errors: NetworkSlice ID already exists.
              schema:
                $ref: "#/components/schemas/REW"
          description: Method Not Allowed
        "400":
          content:
            application/json:
              example:
                description: Bad request
                errors: Exception string
              schema:
                $ref: "#/components/schemas/REW"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create a new Network Slice Product Order
      tags:
      - productOrder
      x-content-type: application/json
